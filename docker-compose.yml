services:
  db:
    image: postgres:16-alpine
    container_name: apparelflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: apparelflow
    ports:
      - "5432:5432"
    volumes:
      - apparelflow_pgdata:/var/lib/postgresql/data

volumes:
  apparelflow_pgdata:
